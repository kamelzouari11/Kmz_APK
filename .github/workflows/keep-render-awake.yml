name: Keep Render awake

on:
  schedule:
    # GitHub Actions utilise UTC. Tunis est à UTC+1 : 13h50-22h00 local.
    - cron: "50 12 * * *"
    - cron: "*/10 13-20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the Render service
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 2
          --retry-all-errors
          https://football-api-9v3x.onrender.com/
