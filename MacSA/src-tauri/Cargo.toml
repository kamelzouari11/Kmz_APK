[package]
name = "mesplacements"
version = "0.1.0"
description = "Suivi des revenus de placements financiers"
authors = ["Mes Placements"]
edition = "2021"

[lib]
name = "mesplacements_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
